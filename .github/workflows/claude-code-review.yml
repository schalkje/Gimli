# AI review for the Review stage of docs/lifecycle.md.
# Runs the code-review plugin when a pull request is marked ready. Later
# pushes start it again, but the plugin skips a pull request it has already
# commented on (see docs/lifecycle.md, Review). Drafts are skipped: Build opens
# a draft and the Evidence stage marks it ready. Pull requests from forks are
# skipped, because GitHub withholds the secret and OIDC token from them.
#
# The job's GITHUB_TOKEN is read-only. Claude posts with the Claude GitHub
# App's own token, so what keeps this review from changing the repository is
# the --allowedTools list below: gh commands that read the pull request or post
# a comment on it, and the inline-comment tool, matching the allowed-tools
# frontmatter of vendor/claude-plugins/code-review/commands/code-review.md.
# Do not add tools that edit files, commit, or push.
#
# The plugin is the copy vendored in vendor/claude-plugins/, served by this
# repository's marketplace (.claude-plugin/marketplace.json). The marketplace
# is given as a Git URL, which the action clones from the default branch, so a
# pull request cannot change the plugin that reviews it; a local path would
# read it from the pull request's own checkout.
#
# On a pull request the action itself replaces the root .claude/, .mcp.json,
# CLAUDE.md and similar files with main's, keeping the pull request's copies
# in .claude-pr/ for the reviewers to read. --setting-sources user also keeps
# the session from loading any project configuration, including nested
# CLAUDE.md files, which that restore does not cover.
#
# The actions are pinned to commit SHAs. What the review loads, and how to
# update the pins and the plugin: docs/workflow-dependencies.md.
#
# The action only runs when this file is identical to the copy on the default
# branch; on a pull request that changes it, the run skips with a warning.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    # One review per pull request at a time. Runs queue rather than cancel, so
    # a push never cuts a review off after some of its comments are posted.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "${{ github.server_url }}/${{ github.repository }}.git"
          plugins: "code-review@gimli"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)" --setting-sources user'
