# Responds to @claude in issue and pull request comments and reviews, so a
# reviewer can ask for an explanation or a fix. On a pull request, a requested
# fix is committed to that pull request's branch; on an issue, the action puts
# it on a new claude/ branch. By default the action does not merge, approve,
# or push to main, but the Claude app's token could: only branch protection on
# main (#29) enforces it. Commits made here count toward the review rule in
# docs/lifecycle.md, Review.
#
# Two gates decide who can trigger it. The job's if: starts it only when the
# comment or review author's association is OWNER, MEMBER or COLLABORATOR, so
# a mention from anyone else on this public repository starts no job and
# cannot displace a waiting request in the concurrency group. The action then
# acts only for users with write access (this workflow does not set
# allowed_non_write_users), which also refuses a read-only collaborator.
#
# Claude reads the whole thread, including text written by people who cannot
# trigger it. Check whose text is in the thread before writing the mention.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    # One @claude run per issue or pull request at a time, so two fix requests
    # do not race on the same branch. GitHub keeps one pending run per group: a
    # third request made while one runs and one waits replaces the waiting one.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
