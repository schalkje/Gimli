# Responds to @claude in issue and pull request comments and reviews, so a
# reviewer can ask for an explanation or a fix. On a pull request, a requested
# fix is committed to that pull request's branch; on an issue, the action puts
# it on a new claude/ branch. Claude never merges, approves, or pushes to
# main. Its commits re-trigger the AI review like any other push.
#
# Only users with write access can trigger it: the action checks the actor,
# and this workflow does not set allowed_non_write_users.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
